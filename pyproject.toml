[project]
name = "upbit-mcp"
version = "1.0.0"
description = "Upbit 암호화폐 데이터 조회 MCP 서버/클라이언트"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
